      - generic [ref=e147]:
        - text: The rule the platform is built on
        - heading "AI explains the score. It never sets it." [level=2] [ref=e148]
        - paragraph [ref=e149]: Health, authenticity, engagement quality, growth and risk are computed in backend code by versioned formulas over stored observations. The same inputs produce the same score today and in three years, and every component that fed it is stored alongside the result. A model can classify a comment or read the output back to you in plain language — it cannot move the number.
      - generic [ref=e150]:
        - generic [ref=e151]:
          - heading "Deterministic and versioned" [level=3] [ref=e157]
          - paragraph [ref=e158]: Nine weighted components, published weights, stored inputs, a formula version on every result. Reproducible by definition.
        - generic [ref=e159]:
          - heading "Confidence is its own axis" [level=3] [ref=e164]
          - paragraph [ref=e165]: A creator can score 91 on health with 40% confidence. We show both, separately, because folding them together is the most misleading thing a tool like this can do.
        - generic [ref=e166]:
          - heading "AI stays in its lane" [level=3] [ref=e171]
          - paragraph [ref=e172]: Classification, extraction, summaries and explanations — each stored with its provider, model, prompt version and evidence. Never follower counts, never demographics.
