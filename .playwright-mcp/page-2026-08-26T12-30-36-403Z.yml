        - heading "Sources are ranked, and the ranking is visible." [level=2] [ref=e221]
        - paragraph [ref=e222]: An official API measurement outranks public research, which outranks model inference. Where a creator connects their account through OAuth, first-party analytics become available and the profile earns SocialOrbit Verified — a status that is never issued from public data alone.
